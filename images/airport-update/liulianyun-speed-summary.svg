<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">榴莲云60节点测速样本摘要</title>
  <desc id="desc">2026年9月23日下午单次测速显示香港20个以及台湾新加坡美国日本各10个VLESS节点，58个返回非零下载结果</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8f3"/>
      <stop offset="1" stop-color="#e4f0e7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <text x="64" y="78" fill="#143d2d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="38" font-weight="800">榴莲云测速截图：关键观察</text>
  <text x="64" y="116" fill="#527060" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20">样本时间 2026-09-23 15:17（中国标准时间）· 单次工具截图</text>
  <g transform="translate(64 160)" font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <g>
      <rect width="210" height="132" rx="18" fill="#1e6a45"/>
      <text x="105" y="46" text-anchor="middle" fill="#cde6d4" font-size="19">香港</text>
      <text x="105" y="98" text-anchor="middle" fill="#fff2a5" font-size="42" font-weight="800">20</text>
    </g>
    <g transform="translate(226)">
      <rect width="210" height="132" rx="18" fill="#317d56"/>
      <text x="105" y="46" text-anchor="middle" fill="#d7ecdc" font-size="19">台湾</text>
      <text x="105" y="98" text-anchor="middle" fill="#fff2a5" font-size="42" font-weight="800">10</text>
    </g>
    <g transform="translate(452)">
      <rect width="210" height="132" rx="18" fill="#3b8b62"/>
      <text x="105" y="46" text-anchor="middle" fill="#d7ecdc" font-size="19">新加坡</text>
      <text x="105" y="98" text-anchor="middle" fill="#fff2a5" font-size="42" font-weight="800">10</text>
    </g>
    <g transform="translate(678)">
