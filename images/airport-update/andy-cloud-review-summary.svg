      <text x="24" y="42" fill="#6ee7b7" font-size="22" font-weight="700">一次性流量</text>
      <text x="24" y="82" fill="#ffffff" font-size="32" font-weight="800">¥100 / 1000GB</text>
    </g>
    <g transform="translate(748 376)">
      <rect width="298" height="106" rx="18" fill="#0f172a" fill-opacity=".6" stroke="#fb7185" stroke-opacity=".55"/>
      <text x="24" y="42" fill="#fda4af" font-size="22" font-weight="700">接入与定位</text>
