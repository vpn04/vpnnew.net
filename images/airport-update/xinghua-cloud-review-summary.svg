    <path d="M111 123C66 126 28 111 13 78c34-11 55-42 94-34 31 6 53 33 47 64-17-1-29 3-43 15Z" fill="url(#petal)"/>
    <path d="M124 150c-13 44-38 72-75 72 0-34-23-62-4-96 15-27 49-39 76-23-9 18-9 30 3 47Z" fill="url(#petal)"/>
    <path d="M158 153c36 27 53 61 35 94-29-20-66-14-88-47-18-27-13-61 11-81 11 17 23 26 42 34Z" fill="url(#petal)"/>
    <path d="M177 127c42-15 80-10 99 21-32 15-47 49-86 49-32 0-57-22-61-52 19-3 32-9 48-18Z" fill="url(#petal)"/>
    <circle cx="139" cy="129" r="31" fill="#006c57"/>
    <path d="M137 158c2 65-29 105-90 124" fill="none" stroke="#006c57" stroke-width="18" stroke-linecap="round"/>
    <path d="M81 258c33-31 71-39 111-24-32 27-67 41-111 24Z" fill="#00715b"/>
  </g>

  <text x="420" y="118" fill="#006c57" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" font-weight="700" letter-spacing="3">2026 低价机场资料核对</text>
  <text x="420" y="194" fill="#14221f" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="60" font-weight="900">杏花云机场测评</text>
  <text x="420" y="246" fill="#5a6561" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26">3年运营资料 · 通用订阅 · 月付 / 年付 / 一次性</text>

  <g transform="translate(80 372)" font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <rect width="310" height="170" rx="24" fill="#ffffff" stroke="#f0ddd3" filter="url(#shadow)"/>
    <text x="28" y="45" fill="#6a716e" font-size="22">最低月付</text>
    <text x="28" y="103" fill="#ff684d" font-size="44" font-weight="900">¥3 / 200GB</text>
    <text x="28" y="140" fill="#58635f" font-size="20">每月流量 · 2台设备</text>
  </g>
  <g transform="translate(425 372)" font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <rect width="310" height="170" rx="24" fill="#ffffff" stroke="#f0ddd3" filter="url(#shadow)"/>
    <text x="28" y="45" fill="#6a716e" font-size="22">最低年付</text>
    <text x="28" y="103" fill="#ff684d" font-size="44" font-weight="900">¥12 / 50GB</text>
    <text x="28" y="140" fill="#58635f" font-size="20">重置口径待核对 · 2台</text>
  </g>
