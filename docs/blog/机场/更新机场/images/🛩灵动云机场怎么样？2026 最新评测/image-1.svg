    <text x="420" y="263" class="td">VLESS</text>
    <text x="565" y="263" class="td">低延迟访问、办公、YouTube、港区内容</text>
    <circle cx="870" cy="256" r="8" class="good"/><text x="890" y="263" class="td">多媒体 / OpenAI 解锁表现良好</text>
  </g>
  <g>
    <rect x="70" y="288" width="1060" height="64" class="cell"/>
    <text x="92" y="327" class="td">台湾</text>
    <text x="260" y="327" class="td">10</text>
    <text x="420" y="327" class="td">VLESS</text>
    <text x="565" y="327" class="td">中文内容、社交平台、备用线路</text>
    <circle cx="870" cy="320" r="8" class="good"/><text x="890" y="327" class="td">媒体访问稳定，适合日常使用</text>
  </g>
  <g>
    <rect x="70" y="352" width="1060" height="64" class="cell"/>
