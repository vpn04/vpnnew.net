  <rect x="70" y="585" width="330" height="86" rx="14" fill="#112b42" stroke="#2a5878"/>
  <text x="94" y="620" class="th">测速结论</text>
  <text x="94" y="650" class="td">节点丰富，适合作为主力机场</text>
  <rect x="435" y="585" width="330" height="86" rx="14" fill="#112b42" stroke="#2a5878"/>
  <text x="459" y="620" class="th">流媒体</text>
  <text x="459" y="650" class="td">YouTube 4K、Netflix、Disney+ 场景友好</text>
  <rect x="800" y="585" width="330" height="86" rx="14" fill="#112b42" stroke="#2a5878"/>
  <text x="824" y="620" class="th">AI 应用</text>
  <text x="824" y="650" class="td">ChatGPT / OpenAI 解锁能力优秀</text>

  <text x="70" y="718" class="muted">说明：本图根据提供的灵动云测速截图整理，实际表现会因地区、运营商、设备、客户端配置和高峰时段而变化。</text>
