  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="86" y="636" width="1108" height="86" rx="12" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="114" y="674" font-size="23" font-weight="800" fill="#0e7490">解锁解读</text>
    <text x="114" y="708" font-size="19" fill="#155e75">YouTube、Netflix、Disney+ 在香港、台湾、新加坡、日本、美国节点均显示对应地区解锁。</text>
