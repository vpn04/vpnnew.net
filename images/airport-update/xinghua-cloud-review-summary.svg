<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">杏花云机场2026测评摘要</title>
  <desc id="desc">杏花云3元200GB月付、12元年付50GB、20元1000GB且365天有效，支持通用订阅。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8f2"/>
      <stop offset="1" stop-color="#f2f7f3"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a5b"/>
      <stop offset="1" stop-color="#ff684d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#7a3a27" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#background)"/>
  <circle cx="1090" cy="70" r="180" fill="#ff744f" opacity=".08"/>
  <circle cx="1030" cy="590" r="250" fill="#006c57" opacity=".07"/>

