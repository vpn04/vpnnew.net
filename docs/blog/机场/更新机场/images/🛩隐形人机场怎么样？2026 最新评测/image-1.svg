<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">隐形人机场线路与套餐摘要图</title>
  <desc id="desc">隐形人机场线路和套餐摘要，展示大机房纯专线、BGP三网优化、144GB月付、1.6TB月流量和一次性不限时流量包。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="860" fill="url(#bg)"/>
  <rect x="56" y="48" width="1168" height="764" rx="18" fill="#ffffff" stroke="#dbeafe"/>
  <text x="86" y="112" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="38" font-weight="800" fill="#0f172a">隐形人机场线路与套餐摘要</text>
  <text x="86" y="154" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#64748b">新加坡海外团队 · 大机房纯专线 · BGP 三网优化 · 测速截图待补</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#111827">
    <rect x="86" y="198" width="1108" height="54" fill="#f1f5f9"/>
    <text x="110" y="233" font-weight="700">套餐</text>
    <text x="336" y="233" font-weight="700">月流量</text>
    <text x="520" y="233" font-weight="700">价格</text>
    <text x="680" y="233" font-weight="700">容量定位</text>
    <text x="1010" y="233" font-weight="700">设备</text>
    <g transform="translate(0 288)"><text x="110" y="0" font-weight="700">白银纪元</text><text x="336" y="0">144GB/月</text><text x="520" y="0">¥24/月</text><rect x="680" y="-22" width="280" height="26" rx="13" fill="#e2e8f0"/><rect x="680" y="-22" width="68" height="26" rx="13" fill="url(#bar)"/><text x="1010" y="0">不限</text></g>
    <g transform="translate(0 358)"><text x="110" y="0" font-weight="700">黄金序列</text><text x="336" y="0">360GB/月</text><text x="520" y="0">¥48/月</text><rect x="680" y="-22" width="280" height="26" rx="13" fill="#e2e8f0"/><rect x="680" y="-22" width="132" height="26" rx="13" fill="url(#bar)"/><text x="1010" y="0">不限</text></g>
    <g transform="translate(0 428)"><text x="110" y="0" font-weight="700">铂金至臻</text><text x="336" y="0">750GB/月</text><text x="520" y="0">¥105/月</text><rect x="680" y="-22" width="280" height="26" rx="13" fill="#e2e8f0"/><rect x="680" y="-22" width="214" height="26" rx="13" fill="url(#bar)"/><text x="1010" y="0">不限</text></g>
    <g transform="translate(0 498)"><text x="110" y="0" font-weight="700">钻石穹顶</text><text x="336" y="0">1.6TB/月</text><text x="520" y="0">¥185/月</text><rect x="680" y="-22" width="280" height="26" rx="13" fill="#e2e8f0"/><rect x="680" y="-22" width="280" height="26" rx="13" fill="url(#bar)"/><text x="1010" y="0">不限</text></g>
    <g transform="translate(0 568)"><text x="110" y="0" font-weight="700">一次性包</text><text x="336" y="0">160GB-1TB</text><text x="520" y="0">¥229起</text><rect x="680" y="-22" width="280" height="26" rx="13" fill="#e2e8f0"/><rect x="680" y="-22" width="176" height="26" rx="13" fill="url(#bar)"/><text x="1010" y="0">1-3台</text></g>
  </g>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="86" y="652" width="1108" height="92" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="114" y="690" font-size="24" font-weight="800" fill="#1d4ed8">线路解读</text>
    <text x="114" y="725" font-size="20" fill="#1e3a8a">核心卖点是纯专线、BGP 三网优化、不限速、常规套餐不限设备；具体测速数据等待截图补充。</text>
  </g>
</svg>
