<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">环球梯60个VLESS节点测速与解锁摘要</title>
  <desc id="desc">2026年9月23日下午截图显示香港、台湾、新加坡、日本、美国共60个VLESS节点，58个测速非零；流媒体和AI检测随地区及节点变化。</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#072d6c"/>
      <stop offset="1" stop-color="#079dcc"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b96a"/>
      <stop offset="1" stop-color="#54df99"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#f5f8fc"/>
  <rect width="1200" height="170" rx="28" fill="url(#header)"/>
  <rect y="142" width="1200" height="28" fill="url(#header)"/>
  <text x="60" y="72" fill="#ffffff" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="40" font-weight="800">环球梯节点测速与解锁摘要</text>
  <text x="60" y="119" fill="#d5f6ff" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22">速度：2026-09-23 15:17 CST · 解锁：16:09 CST · MiaoKo 4.3.3</text>
  <rect x="845" y="40" width="295" height="92" rx="18" fill="#ffffff" fill-opacity="0.14" stroke="#a6f2ff"/>
