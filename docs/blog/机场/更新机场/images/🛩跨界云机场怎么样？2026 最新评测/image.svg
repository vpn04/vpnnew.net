<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">跨界云机场 Logo 与品牌图</title>
  <desc id="desc">橙黄色低多边形飞鸟图形，文字为跨界云 Crossover Cloud。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.55" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd21f"/>
      <stop offset="0.48" stop-color="#ff8a00"/>
      <stop offset="1" stop-color="#e83b16"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe34a"/>
      <stop offset="0.58" stop-color="#ff9700"/>
      <stop offset="1" stop-color="#f04a18"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#8a4b12" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="930" cy="120" r="82" fill="#f97316" opacity="0.08"/>
  <circle cx="210" cy="610" r="110" fill="#0ea5e9" opacity="0.08"/>

  <g filter="url(#shadow)" transform="translate(50 8)">
    <polygon points="305,156 585,346 514,409" fill="url(#wing)"/>
    <polygon points="222,234 585,346 498,455" fill="#ff6d1a"/>
    <polygon points="205,313 498,455 318,493" fill="#f4511e"/>
    <polygon points="318,493 487,455 370,625" fill="#ef3f18"/>
    <polygon points="370,625 487,455 470,637" fill="#ff7a12"/>
    <polygon points="252,202 403,314 336,308" fill="#ffc51c"/>
    <polygon points="322,274 482,358 407,375" fill="#ff9f0a"/>
    <polygon points="514,168 628,385 585,346" fill="#ffc919"/>
    <polygon points="585,346 628,385 498,455" fill="#f05a1f"/>
    <path d="M625 238 C700 202 774 221 813 282 C862 276 907 274 958 261 L854 338 C847 409 792 459 715 457 C666 456 624 429 594 389 C568 353 578 283 625 238 Z" fill="url(#body)"/>
    <polygon points="813,282 960,260 839,342" fill="#f97316"/>
    <circle cx="758" cy="270" r="9" fill="#c51f1a"/>
    <polygon points="594,389 498,455 656,448" fill="#de3d19" opacity="0.72"/>
    <polygon points="628,385 708,455 656,448" fill="#ff8a00"/>
  </g>

  <g text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif">
    <text x="600" y="585" font-size="76" font-weight="800" fill="#111827">跨界云机场</text>
    <text x="600" y="640" font-size="38" font-weight="700" fill="#334155" letter-spacing="2">CROSSOVER CLOUD</text>
  </g>
</svg>
