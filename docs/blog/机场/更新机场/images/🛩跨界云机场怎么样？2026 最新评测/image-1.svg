<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">跨界云机场节点测速摘要图</title>
  <desc id="desc">跨界云机场 2026 年 7 月 19 日节点测速摘要，展示美国、日本、台湾、香港、新加坡节点延迟与速度表现。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.55" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="860" fill="url(#bg)"/>
  <rect x="56" y="48" width="1168" height="764" rx="18" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="86" y="112" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="38" font-weight="800" fill="#111827">跨界云机场节点测速摘要</text>
  <text x="86" y="154" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#64748b">测试时间：2026-07-19 16:18:50 CST · 协议：VLESS · 节点：50/50 · 结果仅供参考</text>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#111827">
    <rect x="86" y="198" width="1108" height="54" fill="#f1f5f9"/>
    <text x="110" y="233" font-weight="700">地区</text>
    <text x="292" y="233" font-weight="700">TLS RTT</text>
    <text x="458" y="233" font-weight="700">平均速度表现</text>
    <text x="860" y="233" font-weight="700">截图最高速度</text>

    <g transform="translate(0 278)">
      <text x="110" y="0" font-weight="700">香港 HK</text>
      <text x="292" y="0">约 97-194ms</text>
      <rect x="458" y="-22" width="520" height="26" rx="13" fill="#e2e8f0"/>
      <rect x="458" y="-22" width="504" height="26" rx="13" fill="url(#bar)"/>
      <text x="998" y="0">最高 617.89MB</text>
    </g>
    <g transform="translate(0 348)">
      <text x="110" y="0" font-weight="700">新加坡 SG</text>
      <text x="292" y="0">约 85-169ms</text>
      <rect x="458" y="-22" width="520" height="26" rx="13" fill="#e2e8f0"/>
      <rect x="458" y="-22" width="360" height="26" rx="13" fill="url(#bar)"/>
      <text x="998" y="0">最高 434.92MB</text>
    </g>
    <g transform="translate(0 418)">
      <text x="110" y="0" font-weight="700">日本 JP</text>
      <text x="292" y="0">约 135-156ms</text>
      <rect x="458" y="-22" width="520" height="26" rx="13" fill="#e2e8f0"/>
      <rect x="458" y="-22" width="356" height="26" rx="13" fill="url(#bar)"/>
      <text x="998" y="0">最高 432.19MB</text>
    </g>
    <g transform="translate(0 488)">
      <text x="110" y="0" font-weight="700">台湾 TW</text>
      <text x="292" y="0">约 162-188ms</text>
      <rect x="458" y="-22" width="520" height="26" rx="13" fill="#e2e8f0"/>
      <rect x="458" y="-22" width="96" height="26" rx="13" fill="url(#bar)"/>
      <text x="998" y="0">最高 116.83MB</text>
    </g>
    <g transform="translate(0 558)">
      <text x="110" y="0" font-weight="700">美国 US</text>
      <text x="292" y="0">约 242-247ms</text>
      <rect x="458" y="-22" width="520" height="26" rx="13" fill="#e2e8f0"/>
      <rect x="458" y="-22" width="62" height="26" rx="13" fill="url(#bar)"/>
      <text x="998" y="0">最高 75.81MB</text>
    </g>
  </g>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="86" y="640" width="1108" height="102" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="114" y="682" font-size="24" font-weight="800" fill="#9a3412">测速解读</text>
    <text x="114" y="718" font-size="20" fill="#7c2d12">香港、新加坡、日本方向速度更突出；美国方向延迟更高，更适合作为 AI 与美国区服务备用节点。</text>
  </g>
</svg>
