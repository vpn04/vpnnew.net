<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">微风网络50节点流媒体检测截图摘要</title>
  <desc id="desc">依据投稿者2026年7月19日的MiaoKo截图整理。截图列出香港15、台湾5、新加坡10、日本10、美国10个VLESS节点，YouTube、Netflix、Disney+检测列显示解锁标签。该图不是原始截图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f8ff"/>
      <stop offset="1" stop-color="#e9f1ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="42" y="38" width="1116" height="554" rx="28" fill="#fff" stroke="#d7e3f5"/>
  <text x="78" y="105" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="38" font-weight="700" fill="#243a5b">微风网络 · 50 节点检测摘要</text>
  <text x="78" y="145" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#667b99">根据投稿者提供的 MiaoKo 截图整理 · 2026-07-19 18:29 CST</text>
  <rect x="78" y="185" width="1044" height="90" rx="18" fill="#e8f5ef"/>
  <text x="105" y="224" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17684e">截图列出：YouTube / Netflix / Disney+ 检测栏显示“解锁”</text>
  <text x="105" y="254" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#347a65">工具检测标签不等于实际登录、片库匹配或持续播放成功。</text>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <rect x="78" y="315" width="192" height="156" rx="18" fill="#edf3ff"/>
    <rect x="290" y="315" width="192" height="156" rx="18" fill="#edf3ff"/>
    <rect x="502" y="315" width="192" height="156" rx="18" fill="#edf3ff"/>
    <rect x="714" y="315" width="192" height="156" rx="18" fill="#edf3ff"/>
    <rect x="926" y="315" width="192" height="156" rx="18" fill="#edf3ff"/>
    <text x="174" y="366" font-size="21" fill="#4e6690">香港</text>
    <text x="386" y="366" font-size="21" fill="#4e6690">台湾</text>
    <text x="598" y="366" font-size="21" fill="#4e6690">新加坡</text>
    <text x="810" y="366" font-size="21" fill="#4e6690">日本</text>
    <text x="1022" y="366" font-size="21" fill="#4e6690">美国</text>
    <text x="174" y="435" font-size="50" font-weight="700" fill="#2d5da9">15</text>
    <text x="386" y="435" font-size="50" font-weight="700" fill="#2d5da9">5</text>
    <text x="598" y="435" font-size="50" font-weight="700" fill="#2d5da9">10</text>
    <text x="810" y="435" font-size="50" font-weight="700" fill="#2d5da9">10</text>
    <text x="1022" y="435" font-size="50" font-weight="700" fill="#2d5da9">10</text>
  </g>
  <text x="78" y="531" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#5f718c">全部50条记录的类型栏均标为 VLESS。此图为摘要，不能推断当前或长期可用率。</text>
</svg>
