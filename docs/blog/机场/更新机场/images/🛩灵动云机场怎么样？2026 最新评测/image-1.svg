    <text x="260" y="391" class="td">10</text>
    <text x="420" y="391" class="td">VLESS</text>
    <text x="565" y="391" class="td">Google、ChatGPT、东南亚业务、跨境办公</text>
    <circle cx="870" cy="384" r="8" class="good"/><text x="890" y="391" class="td">YouTube / Netflix / OpenAI 兼容好</text>
  </g>
  <g>
    <rect x="70" y="416" width="1060" height="64" class="cell"/>
    <text x="92" y="455" class="td">日本</text>
    <text x="260" y="455" class="td">10</text>
    <text x="420" y="455" class="td">VLESS</text>
    <text x="565" y="455" class="td">YouTube 4K、动画、游戏、日区流媒体</text>
    <circle cx="870" cy="448" r="8" class="good"/><text x="890" y="455" class="td">高峰期 4K 视频场景友好</text>
  </g>
  <g>
    <rect x="70" y="480" width="1060" height="64" class="cell"/>
    <text x="92" y="519" class="td">美国</text>
    <text x="260" y="519" class="td">10</text>
    <text x="420" y="519" class="td">VLESS</text>
    <text x="565" y="519" class="td">ChatGPT、OpenAI、Netflix、Disney+、开发者服务</text>
    <circle cx="870" cy="512" r="8" class="good"/><text x="890" y="519" class="td">AI 与美区流媒体适配度高</text>
