  <rect x="60" y="628" width="1080" height="54" rx="12" fill="#fff1d7" stroke="#f1c66d"/>
  <text x="82" y="662" fill="#72501a" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19">解锁图存在失败、N/A与“仅应用”；不能据此宣传所有节点全解锁或保证长期可用。</text>
