<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">无忧链接机场流媒体解锁摘要图</title>
  <desc id="desc">无忧链接机场 2026 年 7 月 18 日流媒体解锁摘要，展示 YouTube、Netflix、Disney+ 在美国、新加坡、台湾、日本、香港节点的解锁情况。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="860" fill="url(#bg)"/>
  <rect x="56" y="48" width="1168" height="764" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="86" y="112" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="38" font-weight="800" fill="#111827">无忧链接流媒体解锁摘要</text>
  <text x="86" y="154" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#64748b">测试时间：2026-07-18 21:47:23 CST · 检测项目：YouTube / Netflix / Disney+ · 结果仅供参考</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22">
    <rect x="86" y="206" width="1108" height="58" fill="#ecfdf5"/>
    <text x="124" y="243" font-weight="800" fill="#065f46">地区节点</text>
    <text x="386" y="243" font-weight="800" fill="#065f46">YouTube</text>
    <text x="642" y="243" font-weight="800" fill="#065f46">Netflix</text>
    <text x="890" y="243" font-weight="800" fill="#065f46">Disney+</text>
    <g fill="#111827">
      <g transform="translate(0 312)"><text x="124" y="0" font-weight="700">美国 LAX</text><text x="386" y="0" fill="#15803d">解锁(US)</text><text x="642" y="0" fill="#15803d">解锁(US)</text><text x="890" y="0" fill="#15803d">解锁(US)</text></g>
      <g transform="translate(0 390)"><text x="124" y="0" font-weight="700">新加坡 SIN</text><text x="386" y="0" fill="#15803d">解锁(SG)</text><text x="642" y="0" fill="#15803d">解锁(SG)</text><text x="890" y="0" fill="#15803d">解锁(SG)</text></g>
      <g transform="translate(0 468)"><text x="124" y="0" font-weight="700">台湾 TPE</text><text x="386" y="0" fill="#15803d">解锁(TW)</text><text x="642" y="0" fill="#15803d">解锁(TW)</text><text x="890" y="0" fill="#15803d">解锁(TW)</text></g>
      <g transform="translate(0 546)"><text x="124" y="0" font-weight="700">日本 TYO</text><text x="386" y="0" fill="#15803d">解锁(JP)</text><text x="642" y="0" fill="#15803d">解锁(JP)</text><text x="890" y="0" fill="#15803d">解锁(JP)</text></g>
      <g transform="translate(0 624)"><text x="124" y="0" font-weight="700">香港 HKG</text><text x="386" y="0" fill="#b45309">多数 HK，个别 CN</text><text x="642" y="0" fill="#15803d">解锁(HK)</text><text x="890" y="0" fill="#15803d">解锁(HK)</text></g>
    </g>
  </g>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="86" y="694" width="1108" height="72" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="114" y="739" font-size="20" fill="#7c2d12">流媒体解锁会随平台策略和节点 IP 变化而变化，正式购买前建议以最新测试为准。</text>
  </g>
