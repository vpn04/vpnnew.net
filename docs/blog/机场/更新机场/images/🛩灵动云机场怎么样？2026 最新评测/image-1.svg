<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10243a"/>
      <stop offset="1" stop-color="#0a1324"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#31d9ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <style>
      .title{font:700 42px Arial,'Microsoft YaHei',sans-serif;fill:#eef8ff}
      .sub{font:400 20px Arial,'Microsoft YaHei',sans-serif;fill:#a9c7dc}
      .th{font:700 19px Arial,'Microsoft YaHei',sans-serif;fill:#dff7ff}
      .td{font:400 18px Arial,'Microsoft YaHei',sans-serif;fill:#eff9ff}
      .muted{font:400 15px Arial,'Microsoft YaHei',sans-serif;fill:#8fb0c7}
      .good{fill:#2dd4bf}
      .warn{fill:#f6c453}
      .bad{fill:#ff6b6b}
      .cell{fill:#142c45;stroke:#25445f;stroke-width:1}
      .head{fill:#173958;stroke:#2d5a7a;stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="760" rx="26" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="170" fill="#1e5a7a" opacity=".16"/>
  <circle cx="180" cy="680" r="220" fill="#6d5cff" opacity=".12"/>
  <path d="M70 152 C220 90 302 214 448 146 S710 118 826 188 1034 204 1130 112" fill="none" stroke="url(#accent)" stroke-width="5" opacity=".55"/>
  <text x="70" y="78" class="title">灵动云机场测速图</text>
  <text x="70" y="116" class="sub">VLESS 专线节点｜香港 / 台湾 / 新加坡 / 日本 / 美国｜流媒体与 AI 解锁概览</text>

  <rect x="70" y="172" width="1060" height="52" rx="8" class="head"/>
  <text x="92" y="205" class="th">节点地区</text>
  <text x="260" y="205" class="th">节点数量</text>
  <text x="420" y="205" class="th">协议</text>
  <text x="565" y="205" class="th">主要用途</text>
  <text x="860" y="205" class="th">解锁表现</text>

  <g>
    <rect x="70" y="224" width="1060" height="64" class="cell"/>
