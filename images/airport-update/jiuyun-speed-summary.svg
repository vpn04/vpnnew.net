<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">九云机场2026年8月VLESS节点测速摘要</title>
  <desc id="desc">上海电信1Gbps测试环境下，九云机场日本、新加坡、香港、台湾和美国各四个节点的平均速度均值对比。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152a52"/>
      <stop offset="1" stop-color="#38165d"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a30"/>
      <stop offset="0.48" stop-color="#ef3f91"/>
      <stop offset="1" stop-color="#1fc7e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#050817" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <circle cx="1080" cy="95" r="155" fill="#e93a98" opacity=".09"/>
  <circle cx="90" cy="670" r="210" fill="#21c8e5" opacity=".08"/>
  <text x="64" y="76" fill="#fff" font-family="Inter,Arial,'Microsoft YaHei',sans-serif" font-size="34" font-weight="700">九云机场 VLESS 节点测速摘要</text>
  <text x="64" y="114" fill="#bfcae5" font-family="Inter,Arial,'Microsoft YaHei',sans-serif" font-size="19">2026-08-27 · 上海电信 1Gbps · 20 个实际地区节点 · 单次测试</text>

  <g font-family="Inter,Arial,'Microsoft YaHei',sans-serif" font-size="21">
    <g transform="translate(64 166)">
      <rect width="250" height="86" rx="16" fill="#fff" opacity=".08"/>
      <text x="22" y="34" fill="#bfc9e5" font-size="16">平均速度均值</text>
      <text x="22" y="67" fill="#fff" font-size="27" font-weight="700">69.94 MB/s</text>
    </g>
    <g transform="translate(330 166)">
      <rect width="250" height="86" rx="16" fill="#fff" opacity=".08"/>
      <text x="22" y="34" fill="#bfc9e5" font-size="16">平均速度中位数</text>
      <text x="22" y="67" fill="#fff" font-size="27" font-weight="700">71.72 MB/s</text>
    </g>
    <g transform="translate(596 166)">
      <rect width="250" height="86" rx="16" fill="#fff" opacity=".08"/>
      <text x="22" y="34" fill="#bfc9e5" font-size="16">TLS RTT 中位数</text>
      <text x="22" y="67" fill="#fff" font-size="27" font-weight="700">151 ms</text>
    </g>
    <g transform="translate(862 166)">
      <rect width="274" height="86" rx="16" fill="#fff" opacity=".08"/>
      <text x="22" y="34" fill="#bfc9e5" font-size="16">报告汇总</text>
      <text x="22" y="67" fill="#fff" font-size="23" font-weight="700">ChatGPT / YouTube 100%</text>
    </g>
  </g>

  <g transform="translate(64 296)" font-family="Inter,Arial,'Microsoft YaHei',sans-serif" filter="url(#shadow)">
    <rect width="1072" height="334" rx="22" fill="#fff" opacity=".97"/>
    <text x="28" y="43" fill="#24304c" font-size="19" font-weight="700">地区</text>
    <text x="260" y="43" fill="#68718a" font-size="16">4个节点平均速度的地区均值（MB/s）</text>

    <g transform="translate(28 76)">
      <text x="0" y="22" fill="#29324a" font-size="20" font-weight="600">日本</text>
      <rect x="145" y="2" width="800" height="25" rx="12" fill="#e8ebf3"/>
      <rect x="145" y="2" width="633" height="25" rx="12" fill="url(#bar)"/>
      <text x="966" y="22" fill="#28314a" font-size="20" font-weight="700">79.18</text>
    </g>
    <g transform="translate(28 127)">
      <text x="0" y="22" fill="#29324a" font-size="20" font-weight="600">新加坡</text>
      <rect x="145" y="2" width="800" height="25" rx="12" fill="#e8ebf3"/>
      <rect x="145" y="2" width="578" height="25" rx="12" fill="url(#bar)"/>
      <text x="966" y="22" fill="#28314a" font-size="20" font-weight="700">72.22</text>
    </g>
    <g transform="translate(28 178)">
      <text x="0" y="22" fill="#29324a" font-size="20" font-weight="600">香港</text>
      <rect x="145" y="2" width="800" height="25" rx="12" fill="#e8ebf3"/>
      <rect x="145" y="2" width="573" height="25" rx="12" fill="url(#bar)"/>
      <text x="966" y="22" fill="#28314a" font-size="20" font-weight="700">71.63</text>
    </g>
    <g transform="translate(28 229)">
      <text x="0" y="22" fill="#29324a" font-size="20" font-weight="600">台湾</text>
      <rect x="145" y="2" width="800" height="25" rx="12" fill="#e8ebf3"/>
      <rect x="145" y="2" width="552" height="25" rx="12" fill="url(#bar)"/>
      <text x="966" y="22" fill="#28314a" font-size="20" font-weight="700">69.02</text>
    </g>
    <g transform="translate(28 280)">
      <text x="0" y="22" fill="#29324a" font-size="20" font-weight="600">美国</text>
      <rect x="145" y="2" width="800" height="25" rx="12" fill="#e8ebf3"/>
      <rect x="145" y="2" width="461" height="25" rx="12" fill="url(#bar)"/>
      <text x="966" y="22" fill="#28314a" font-size="20" font-weight="700">57.66</text>
    </g>
  </g>
  <text x="64" y="674" fill="#bfc9e5" font-family="Inter,Arial,'Microsoft YaHei',sans-serif" font-size="16">数据来自所给 FFQ.LA 截图；测速结果仅代表该测试端、该时段和该批节点，不等于长期稳定性承诺。</text>
</svg>
