<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">梯子云机场流媒体与 AI 解锁摘要图</title>
  <desc id="desc">梯子云机场 2026 年 7 月 21 日流媒体与 AI 解锁摘要，展示 YouTube、Netflix、Disney+、OpenAI、Bahamut 与 TikTok 在不同节点地区的表现。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="820" fill="url(#bg)"/>
  <rect x="56" y="48" width="1168" height="724" rx="18" fill="#ffffff" stroke="#dbeafe"/>
  <text x="86" y="112" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="38" font-weight="800" fill="#0f172a">梯子云流媒体与 AI 解锁摘要</text>
  <text x="86" y="154" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#64748b">测试时间：2026-07-21 19:12:14 CST · 协议：VLESS · 节点：60/60 · 结果仅供参考</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20">
    <rect x="86" y="198" width="1108" height="54" fill="#f1f5f9"/>
    <text x="110" y="233" font-weight="700" fill="#111827">地区</text>
    <text x="260" y="233" font-weight="700" fill="#111827">YouTube</text>
    <text x="420" y="233" font-weight="700" fill="#111827">Netflix</text>
    <text x="580" y="233" font-weight="700" fill="#111827">Disney+</text>
    <text x="750" y="233" font-weight="700" fill="#111827">OpenAI</text>
    <text x="910" y="233" font-weight="700" fill="#111827">备注</text>
    <g transform="translate(0 286)">
      <text x="110" y="0" font-weight="700" fill="#0f172a">日本 JP</text>
      <text x="260" y="0" fill="#166534">JP</text><text x="420" y="0" fill="#166534">JP</text><text x="580" y="0" fill="#166534">JP</text><text x="750" y="0" fill="#166534">JP</text>
      <text x="910" y="0" fill="#334155">主流项目较完整</text>
    </g>
    <g transform="translate(0 354)">
      <text x="110" y="0" font-weight="700" fill="#0f172a">新加坡 SG</text>
      <text x="260" y="0" fill="#b45309">部分 CN</text><text x="420" y="0" fill="#166534">SG</text><text x="580" y="0" fill="#166534">HK</text><text x="750" y="0" fill="#166534">SG</text>
      <text x="910" y="0" fill="#334155">需切换 YouTube 节点</text>
    </g>
    <g transform="translate(0 422)">
      <text x="110" y="0" font-weight="700" fill="#0f172a">美国 US</text>
      <text x="260" y="0" fill="#166534">US</text><text x="420" y="0" fill="#166534">HK</text><text x="580" y="0" fill="#166534">HK</text><text x="750" y="0" fill="#166534">US</text>
      <text x="910" y="0" fill="#334155">适合 OpenAI / Google</text>
    </g>
    <g transform="translate(0 490)">
      <text x="110" y="0" font-weight="700" fill="#0f172a">香港 HK</text>
      <text x="260" y="0" fill="#166534">HK</text><text x="420" y="0" fill="#166534">HK</text><text x="580" y="0" fill="#166534">HK</text><text x="750" y="0" fill="#166534">TW/HK</text>
      <text x="910" y="0" fill="#334155">流媒体覆盖较好</text>
    </g>
    <g transform="translate(0 558)">
      <text x="110" y="0" font-weight="700" fill="#0f172a">台湾 TW</text>
      <text x="260" y="0" fill="#b45309">部分 CN</text><text x="420" y="0" fill="#166534">ES</text><text x="580" y="0" fill="#166534">ES</text><text x="750" y="0" fill="#166534">TW</text>
      <text x="910" y="0" fill="#334155">区服识别会浮动</text>
    </g>
  </g>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="86" y="636" width="1108" height="86" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="114" y="674" font-size="23" font-weight="800" fill="#1d4ed8">解锁解读</text>
    <text x="114" y="708" font-size="19" fill="#1e3a8a">Netflix、Disney+、YouTube、OpenAI 覆盖面较广；TikTok 与 Dazn 需要按目标地区逐节点实测。</text>
  </g>
</svg>
