<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">杏花云21个VLESS节点晚高峰测速摘要</title>
  <desc id="desc">2026年10月10日19点15分，广西移动2Gbps后端单次测试；21个实际节点全部返回非零速度，整体平均30.94MB每秒，日本组平均40.97MB每秒。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8f2"/>
      <stop offset="1" stop-color="#eef7f2"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a55"/>
      <stop offset="1" stop-color="#ffb16d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="16" flood-color="#21473e" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1200" height="680" rx="36" fill="url(#bg)"/>
  <circle cx="1120" cy="35" r="190" fill="#ff7957" opacity=".07"/>
  <circle cx="80" cy="660" r="180" fill="#00705b" opacity=".06"/>

  <text x="64" y="77" fill="#12251f" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="42" font-weight="900">杏花云晚高峰测速摘要</text>
  <text x="64" y="118" fill="#5c6864" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22">2026-10-10 19:15 CST · 广西移动@2Gbps · SpeedCentre+ · VLESS</text>

  <g transform="translate(64 154)" font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <g filter="url(#shadow)">
      <rect width="250" height="118" rx="20" fill="#ffffff" stroke="#e7ddd6"/>
      <text x="22" y="38" fill="#68736f" font-size="19">实际节点</text>
      <text x="22" y="89" fill="#00705b" font-size="39" font-weight="900">21 / 21</text>
    </g>
    <g transform="translate(274)" filter="url(#shadow)">
      <rect width="250" height="118" rx="20" fill="#ffffff" stroke="#e7ddd6"/>
      <text x="22" y="38" fill="#68736f" font-size="19">平均速度均值</text>
      <text x="22" y="89" fill="#ff684d" font-size="36" font-weight="900">30.94 MB/s</text>
    </g>
    <g transform="translate(548)" filter="url(#shadow)">
      <rect width="250" height="118" rx="20" fill="#ffffff" stroke="#e7ddd6"/>
      <text x="22" y="38" fill="#68736f" font-size="19">最高瞬时值</text>
      <text x="22" y="89" fill="#ff684d" font-size="36" font-weight="900">55.59 MB/s</text>
    </g>
    <g transform="translate(822)" filter="url(#shadow)">
      <rect width="250" height="118" rx="20" fill="#ffffff" stroke="#cfe4da"/>
      <text x="22" y="38" fill="#68736f" font-size="19">HTTPS延迟中位数</text>
      <text x="22" y="89" fill="#00705b" font-size="39" font-weight="900">546 ms</text>
    </g>
  </g>

  <g transform="translate(64 324)" font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="0" y="0" fill="#24322e" font-size="25" font-weight="800">五地区节点平均速度</text>
    <text x="860" y="0" fill="#6c7773" font-size="17">截图列单位按 MB/s 解读</text>

    <g transform="translate(0 34)">
      <text x="0" y="29" fill="#36443f" font-size="22">日本</text>
      <rect x="86" y="6" width="820" height="28" rx="14" fill="#e6ece8"/>
      <rect x="86" y="6" width="672" height="28" rx="14" fill="url(#bar)"/>
      <text x="932" y="29" fill="#15241f" font-size="22" font-weight="800">40.97</text>
    </g>
    <g transform="translate(0 84)">
      <text x="0" y="29" fill="#36443f" font-size="22">台湾</text>
      <rect x="86" y="6" width="820" height="28" rx="14" fill="#e6ece8"/>
      <rect x="86" y="6" width="558" height="28" rx="14" fill="url(#bar)"/>
      <text x="932" y="29" fill="#15241f" font-size="22" font-weight="800">34.04</text>
    </g>
    <g transform="translate(0 134)">
      <text x="0" y="29" fill="#36443f" font-size="22">新加坡</text>
      <rect x="86" y="6" width="820" height="28" rx="14" fill="#e6ece8"/>
      <rect x="86" y="6" width="513" height="28" rx="14" fill="url(#bar)"/>
      <text x="932" y="29" fill="#15241f" font-size="22" font-weight="800">31.27</text>
    </g>
    <g transform="translate(0 184)">
      <text x="0" y="29" fill="#36443f" font-size="22">美国</text>
      <rect x="86" y="6" width="820" height="28" rx="14" fill="#e6ece8"/>
      <rect x="86" y="6" width="471" height="28" rx="14" fill="url(#bar)"/>
      <text x="932" y="29" fill="#15241f" font-size="22" font-weight="800">28.74</text>
    </g>
    <g transform="translate(0 234)">
      <text x="0" y="29" fill="#36443f" font-size="22">香港</text>
      <rect x="86" y="6" width="820" height="28" rx="14" fill="#e6ece8"/>
      <rect x="86" y="6" width="346" height="28" rx="14" fill="url(#bar)"/>
      <text x="932" y="29" fill="#15241f" font-size="22" font-weight="800">21.07</text>
    </g>
  </g>

  <text x="64" y="646" fill="#61706b" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18">单次远端后端样本仅用于横向参考；不能代表本地三网、连续在线率、丢包、游戏延迟或长期稳定性</text>
</svg>
