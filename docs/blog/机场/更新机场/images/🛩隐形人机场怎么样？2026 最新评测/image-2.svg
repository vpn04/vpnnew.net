<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">隐形人机场流媒体与 AI 支持摘要图</title>
  <desc id="desc">隐形人机场流媒体与AI支持摘要，展示Netflix、Prime Video、BBC、Abema、TVer、ChatGPT 4、GitHub Copilot和Hugging Face。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="820" fill="url(#bg)"/>
  <rect x="56" y="48" width="1168" height="724" rx="18" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="86" y="112" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="38" font-weight="800" fill="#0f172a">隐形人流媒体与 AI 支持摘要</text>
  <text x="86" y="154" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#64748b">基于提供信息整理 · 平台区服会随节点与策略变化 · 结果以实际测试为准</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#111827">
    <rect x="92" y="210" width="324" height="118" rx="14" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="122" y="252" font-weight="800" fill="#166534">流媒体全家桶</text>
    <text x="122" y="292" font-size="19" fill="#14532d">Netflix · Prime Video · BBC</text>
    <rect x="478" y="210" width="324" height="118" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="508" y="252" font-weight="800" fill="#1d4ed8">日韩内容平台</text>
    <text x="508" y="292" font-size="19" fill="#1e3a8a">Abema · TVer · 4K / 8K</text>
    <rect x="864" y="210" width="324" height="118" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="894" y="252" font-weight="800" fill="#6d28d9">AI 与开发工具</text>
    <text x="894" y="292" font-size="19" fill="#4c1d95">ChatGPT 4 · Copilot · HF</text>
    <rect x="92" y="382" width="324" height="118" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="122" y="424" font-weight="800" fill="#c2410c">跨境业务</text>
    <text x="122" y="464" font-size="19" fill="#7c2d12">电商后台 · 自媒体 · 商务</text>
    <rect x="478" y="382" width="324" height="118" rx="14" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="508" y="424" font-weight="800" fill="#0f766e">稳定会议</text>
    <text x="508" y="464" font-size="19" fill="#134e4a">网课 · 视频会议 · 远程办公</text>
    <rect x="864" y="382" width="324" height="118" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="894" y="424" font-weight="800" fill="#334155">一次性备用</text>
    <text x="894" y="464" font-size="19" fill="#334155">160GB · 420GB · 1TB</text>
  </g>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="92" y="582" width="1096" height="94" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="122" y="620" font-size="24" font-weight="800" fill="#0f172a">使用建议</text>
    <text x="122" y="656" font-size="20" fill="#334155">先用白银纪元月付测试本地网络；确认流媒体、AI 工具和晚高峰稳定后，再考虑长周期或不限时包。</text>
  </g>
