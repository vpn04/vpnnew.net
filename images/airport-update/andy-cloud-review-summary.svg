<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Andy Cloud 机场 2026 测评摘要</title>
  <desc id="desc">Andy Cloud 5元100GB月付、30元年付50GB每月、100元1000GB一次性流量，支持通用订阅。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#152755"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b63"/>
      <stop offset="0.28" stop-color="#ffb21d"/>
      <stop offset="0.52" stop-color="#35e18a"/>
      <stop offset="0.75" stop-color="#04b8f2"/>
      <stop offset="1" stop-color="#7a2cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <circle cx="1100" cy="80" r="260" fill="#4f46e5" opacity=".18"/>
  <circle cx="85" cy="610" r="270" fill="#06b6d4" opacity=".12"/>
  <g filter="url(#shadow)">
    <rect x="64" y="62" width="1072" height="506" rx="30" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".17"/>
  </g>
  <g transform="translate(92 106)">
    <text x="0" y="142" fill="url(#brand)" font-family="Arial, sans-serif" font-size="174" font-weight="900" letter-spacing="-22">AD</text>
    <text x="4" y="199" fill="#a5b4fc" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="22" font-weight="700" letter-spacing="4">ANDY CLOUD</text>
  </g>
  <g font-family="Arial, 'Noto Sans SC', sans-serif">
    <text x="425" y="148" fill="#ffffff" font-size="50" font-weight="800">Andy Cloud 机场测评</text>
    <text x="428" y="198" fill="#c7d2fe" font-size="25" font-weight="600">2026 套餐价格、通用订阅与选购建议</text>
    <g transform="translate(425 248)">
      <rect width="298" height="106" rx="18" fill="#0f172a" fill-opacity=".6" stroke="#38bdf8" stroke-opacity=".55"/>
      <text x="24" y="42" fill="#7dd3fc" font-size="22" font-weight="700">最低月付</text>
      <text x="24" y="82" fill="#ffffff" font-size="32" font-weight="800">¥5 / 100GB</text>
    </g>
    <g transform="translate(748 248)">
      <rect width="298" height="106" rx="18" fill="#0f172a" fill-opacity=".6" stroke="#a78bfa" stroke-opacity=".55"/>
      <text x="24" y="42" fill="#c4b5fd" font-size="22" font-weight="700">最低年付</text>
      <text x="24" y="82" fill="#ffffff" font-size="32" font-weight="800">¥30 / 50GB每月</text>
