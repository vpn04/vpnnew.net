    <text x="60" y="365" fill="#172f50" font-size="24" font-weight="700">台湾</text>
    <text x="215" y="365" fill="#172f50" font-size="24">10 / 10</text>
    <rect x="395" y="341" width="400" height="27" rx="14" fill="#dce6ef"/>
