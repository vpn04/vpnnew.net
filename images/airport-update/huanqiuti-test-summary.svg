    <text x="215" y="438" fill="#172f50" font-size="24">10 / 10</text>
    <rect x="395" y="414" width="400" height="27" rx="14" fill="#dce6ef"/>
    <rect x="395" y="414" width="400" height="27" rx="14" fill="url(#bar)"/>
